<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>D6shop</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(140, 0, 255, 0.22),
      transparent 38%
    ),
    radial-gradient(
      circle at 20% 80%,
      rgba(100, 0, 255, 0.12),
      transparent 35%
    ),
    #000;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;
}

/* PURPLE AMBIENT GLOW */
body::before,
body::after {
  content: "";
  position: fixed;
  width: 450px;
  height: 450px;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(120px);
  opacity: .18;
}

body::before {
  background: #8b00ff;
  top: -220px;
  left: -180px;
}

body::after {
  background: #6a00ff;
  bottom: -250px;
  right: -180px;
}

/* STAR BANNER */
.banner {
  position: relative;
  width: 100%;
  height: 220px;
  background: #020202;
  border: 2px solid #7d00ff;
  border-radius: 0 0 24px 24px;
  box-shadow:
    0 0 15px rgba(132, 0, 255, .8),
    0 0 45px rgba(132, 0, 255, .45),
    inset 0 0 35px rgba(132, 0, 255, .12);
  overflow: hidden;
}

/* DETAILED STAR FIELD */
.stars,
.stars::before,
.stars::after {
  position: absolute;
  inset: -100%;
  content: "";
  background-repeat: repeat;
  pointer-events: none;
}

.stars {
  background-image:
    radial-gradient(circle, #fff 0.7px, transparent 1.4px),
    radial-gradient(circle, #fff 1px, transparent 1.7px),
    radial-gradient(circle, #c77dff 0.8px, transparent 1.5px),
    radial-gradient(circle, #9b3cff 0.6px, transparent 1.4px);
  background-size:
    37px 41px,
    71px 67px,
    53px 59px,
    91px 83px;
  background-position:
    0 0,
    15px 20px,
    30px 5px,
    50px 35px;
  animation: starsMove 18s linear infinite;
  opacity: .9;
}

.stars::before {
  background-image:
    radial-gradient(circle, #fff 1.2px, transparent 2px),
    radial-gradient(circle, #a64dff 1px, transparent 2px);
  background-size:
    113px 97px,
    149px 137px;
  background-position:
    25px 50px,
    70px 10px;
  animation: starsMove 30s linear infinite reverse;
  opacity: .65;
}

.stars::after {
  background-image:
    radial-gradient(circle, #fff 1.5px, transparent 2.5px),
    radial-gradient(circle, #d49aff 1px, transparent 2px);
  background-size:
    173px 157px,
    211px 191px;
  background-position:
    90px 40px,
    20px 100px;
  animation: starsDrift 40s linear infinite;
  opacity: .45;
}

@keyframes starsMove {
  from {
    transform: translate3d(0, 0, 0);
  }

  to {
    transform: translate3d(120px, 90px, 0);
  }
}

@keyframes starsDrift {
  from {
    transform: translate3d(0, 0, 0);
  }

  to {
    transform: translate3d(-100px, 120px, 0);
  }
}

/* GLOWING D6 */
.logo {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  color: #d28cff;
  font-size: clamp(60px, 10vw, 110px);
  font-weight: 900;
  letter-spacing: 8px;

  text-shadow:
    0 0 5px #fff,
    0 0 10px #d36cff,
    0 0 20px #b42cff,
    0 0 35px #9900ff,
    0 0 60px #7800ff,
    0 0 100px #5c00ff;

  animation: logoGlow 3s ease-in-out infinite alternate;
}

@keyframes logoGlow {
  from {
    text-shadow:
      0 0 5px #fff,
      0 0 12px #d36cff,
      0 0 25px #a72cff,
      0 0 45px #7800ff;
  }

  to {
    text-shadow:
      0 0 7px #fff,
      0 0 18px #e09aff,
      0 0 35px #b42cff,
      0 0 65px #8b00ff,
      0 0 100px #6500ff;
  }
}

/* INFORMATION */
.info {
  position: relative;
  z-index: 5;
  text-align: center;
  margin-top: 55px;
  padding: 0 20px;
}

.delivery {
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 800;
  letter-spacing: 1px;
  text-shadow:
    0 0 8px rgba(255, 255, 255, .35),
    0 0 20px rgba(130, 0, 255, .45);
}

.discord {
  margin-top: 18px;
  font-size: clamp(16px, 3vw, 21px);
  color: #aaa;
}

.discord span {
  color: #fff;
  font-weight: 900;
  text-shadow:
    0 0 5px #fff,
    0 0 12px #fff,
    0 0 25px #fff,
    0 0 45px rgba(255, 255, 255, .9);

  animation: whiteGlow 2s ease-in-out infinite alternate;
}

@keyframes whiteGlow {
  from {
    text-shadow:
      0 0 5px #fff,
      0 0 12px #fff,
      0 0 20px rgba(255,255,255,.7);
  }

  to {
    text-shadow:
      0 0 8px #fff,
      0 0 18px #fff,
      0 0 35px #fff,
      0 0 55px rgba(255,255,255,.9);
  }
}

/* PURPLE GLOW LINE */
.glow-line {
  width: 75%;
  height: 2px;
  margin: 45px auto;
  background: #9b32ff;
  box-shadow:
    0 0 8px #9b32ff,
    0 0 20px #7d00ff,
    0 0 40px #5c00ff;
}

/* MOBILE */
@media (max-width: 600px) {
  .banner {
    height: 170px;
    border-radius: 0 0 18px 18px;
  }

  .logo {
    letter-spacing: 5px;
  }

  .glow-line {
    width: 85%;
  }
}
</style>
</head>

<body>

<header class="banner">
  <div class="stars"></div>
  <div class="logo">D6</div>
</header>

<div class="info">

  <div class="delivery">
    Statewide Delivery, Local 315/607
  </div>

  <div class="discord">
    Contact Me On Discord:
    <span>d911040408</span>
  </div>

</div>

<div class="glow-line"></div>

</body>
</html>
